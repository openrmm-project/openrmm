name: Docs site

# docs.openrmm.io, built from the guides in this repository (website/README.md).
# A merge to main that touches a guide publishes it; a pull request only builds,
# so a broken link or a page that no longer renders fails before it is merged.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'deploy/QUICKSTART.md'
      - 'deploy/README-production.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'website/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'deploy/QUICKSTART.md'
      - 'deploy/README-production.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'website/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time, and never cancel one halfway through.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      # The full history gives each page the date of its source file's last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      # No dependency runs an install script: the build needs none.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
