server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config: point the SPA at its own origin (nginx proxies the API).
    location = /config.js {
        default_type application/javascript;
        return 200 "window.__API_BASE__ = location.origin;";
    }

    # API + health -> server. proxy_buffering off so SSE (AI chat / MCP) streams.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /mcp {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /healthz { proxy_pass http://server:8080; }

    # WebSocket: agent connection + native remote relay.
    location /ws/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Agent installer script + agent binary downloads (mounted from deploy/public).
    location = /install.sh {
        root /usr/share/nginx/dl;
        default_type text/x-shellscript;
    }
    location = /install.ps1 {
        root /usr/share/nginx/dl;
        default_type text/plain;
    }
    location /dl/ {
        alias /usr/share/nginx/dl/;
        default_type application/octet-stream;
    }

    # Static SPA (no-build prototype).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
