name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Verify module checksums
        run: go mod verify
      - name: Vulnerability scan (advisory)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build server & agent
        run: |
          CGO_ENABLED=0 go build ./cmd/server
          CGO_ENABLED=0 go build ./cmd/agent
      - name: Cross-compile agent & sidecar (Windows)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/rmm-remote
