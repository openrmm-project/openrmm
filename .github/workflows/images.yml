name: Container images

# Publishes the server and console images to GHCR.
#
# Registry images let operators deploy builds traceable to a source commit.
#
# Tags land as:
#   ghcr.io/<owner>/openrmm-server:0.8.0   (from the git tag)
#   ghcr.io/<owner>/openrmm-server:0.5     (minor, moves with patches)
#   ghcr.io/<owner>/openrmm-server:latest  (release tags only)
#   ghcr.io/<owner>/openrmm-server:main    (every push to main)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Extra tag to publish (e.g. "lab")'
        required: false
        type: string

# Least privilege, granted per job rather than repository-wide.
permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            target: server
            image: openrmm-server
          - component: frontend
            target: frontend
            image: openrmm-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag_suffix }},enable=${{ inputs.tag_suffix != '' }}
          labels: |
            org.opencontainers.image.title=OpenRMM ${{ matrix.component }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          # amd64 only, deliberately. The Dockerfile compiles inside the target
          # platform's stage rather than cross-compiling, so building arm64 here
          # would run the Go toolchain under QEMU — an order of magnitude slower,
          # for minutes this project is currently rationing.
          #
          # Current deployments target amd64; add arm64 when needed.
          # To add it, first teach the Dockerfile to cross-compile:
          #   FROM --platform=$BUILDPLATFORM golang AS server-build
          #   ARG TARGETARCH
          #   RUN CGO_ENABLED=0 GOOS=linux GOARCH=$TARGETARCH go build ...
          # then set platforms back to linux/amd64,linux/arm64.
          platforms: linux/amd64
          push: true
          # The server's own version (Settings ▸ Configuration, rmm-server
          # -version): the tag's semver on a release, the branch name otherwise.
          # Unused by the frontend target.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: without it every run recompiles the Go
          # binary and reinstalls npm, which is most of the minutes this
          # workflow costs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # What ties the image back to this commit and this workflow. Without it,
      # "which source produced this image" has no answer a third party can check
      # — the same gap that made the unsigned /dl/ artifacts a go-live blocker.
      #
      # Non-blocking, matching the release workflow: attestation is unavailable
      # for user-owned private repositories ("Feature not available…"), and
      # failing the build over it means no image is published at all. It starts
      # producing provenance by itself once the repository is public. Losing the
      # attestation is a gap in traceability; losing the image is a gap in
      # everything downstream that needs one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan:
    name: Vulnerability scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        image: [openrmm-server, openrmm-frontend]
    steps:
      # Scanning after publishing rather than before is deliberate: the image
      # that gets scanned must be the one that will actually be pulled, not a
      # locally built lookalike. A finding here fails the run loudly, and the
      # tag can be withdrawn.
      #
      # Runs the trivy image directly rather than the action, matching how
      # ci.yml already does it — same pinning policy, and Dependabot's docker
      # ecosystem tracks the tag.
      # The name as it was pushed: registry paths are lower case, whatever the
      # owner's spelling, and a release tag v1.2.3 is published as 1.2.3 (the semver
      # pattern above). Either mismatch made trivy refuse the reference before
      # scanning anything, so this gate never ran.
      - name: Trivy (blocks on fixable HIGH/CRITICAL)
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image }}
          REF: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${OWNER,,}/$NAME:${REF#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.58.1 image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
              "$image"
