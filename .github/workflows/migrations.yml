name: Database migrations

on:
  push:
    branches: [main]
    paths:
      - 'internal/store/**'
      - 'db/schema.sql'
      - 'cmd/server/main.go'
      - '.github/workflows/migrations.yml'
  pull_request:
    paths:
      - 'internal/store/**'
      - 'db/schema.sql'
      - 'cmd/server/main.go'
      - '.github/workflows/migrations.yml'

jobs:
  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rmm
          POSTGRES_PASSWORD: rmm
          POSTGRES_DB: rmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmm -d rmm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RMM_TEST_DATABASE_URL: postgres://rmm:rmm@localhost:5432/rmm_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      # The whole package, not an allowlist of test names: every DB-backed test
      # in internal/store skips silently without RMM_TEST_DATABASE_URL, so a
      # named pattern means a new integration test is added, passes locally, and
      # never runs here again. Postgres is already provisioned above; running the
      # unit tests alongside it costs nothing.
      - run: go test ./internal/store -count=1
