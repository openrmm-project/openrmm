name: Database migrations

env:
  GO_VERSION: '1.26.10'

# The database tests, and the coverage of every Go package with them in.
#
# Same reasoning as ci.yml: a superseded pull-request run is wasted budget, a
# run on main is the one that says whether main is good.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      # Any Go change: this job also measures coverage, with the database
      # tests in, for every package.
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'db/schema.sql'
      - 'internal/store/migrations/**'
      - 'internal/store/testdata/**'
      - '.github/workflows/migrations.yml'
      - '.github/scripts/coverage-summary.py'
  pull_request:
    paths:
      # Any Go change: this job also measures coverage, with the database
      # tests in, for every package.
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'db/schema.sql'
      - 'internal/store/migrations/**'
      - 'internal/store/testdata/**'
      - '.github/workflows/migrations.yml'
      - '.github/scripts/coverage-summary.py'

jobs:
  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rmm
          POSTGRES_PASSWORD: rmm
          POSTGRES_DB: rmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmm -d rmm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RMM_TEST_DATABASE_URL: postgres://rmm:rmm@localhost:5432/rmm_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      # Every package, not an allowlist: every DB-backed test skips silently
      # without RMM_TEST_DATABASE_URL, so a list of names or packages means a new
      # integration test is added, passes locally, and never runs here again. A
      # package list had already bitten twice (settings and api, then ai,
      # mcpserver, patches and scheduler grew DB-backed tests that CI had never
      # run). Running ./... with Postgres up closes that for good.
      #
      # Coverage is measured here because only here do the DB-backed tests run:
      # elsewhere store, api and the scheduler read near zero. -coverpkg counts
      # a statement covered by any package's tests (the API tests exercise the
      # store, for one).
      - name: Unit and database tests, with coverage
        run: go test ./... -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out
      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        run: python3 .github/scripts/coverage-summary.py coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('coverage.out') != ''
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14
