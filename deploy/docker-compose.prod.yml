# Production topology: split ingress so a firewall / security group restricts
# the console while the agents door stays open to untrusted networks.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Set the required vars in deploy/.env (see README-production.md), then apply
# the firewall rules from that README to the two published host ports.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: rmm
    volumes:
      - rmm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No host port: only the server (same compose network) needs Postgres.

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RMM_HTTP_ADDR: ":8080"
      # Point at the AGENTS door's public URL so remote-relay URLs pushed to
      # agents are reachable from their (untrusted) networks. The console can
      # live on a different host/URL — the SPA calls its own origin.
      RMM_PUBLIC_URL: ${RMM_PUBLIC_URL:?e.g. https://agents.rmm.example.com}
      RMM_DATABASE_URL: "postgres://rmm:${POSTGRES_PASSWORD}@postgres:5432/rmm?sslmode=disable"
      RMM_ADMIN_TOKEN: ${RMM_ADMIN_TOKEN:?openssl rand -hex 32}
      # nginx is the edge here, so trust its X-Forwarded-For for client IPs.
      RMM_TRUST_PROXY_HEADERS: "true"
      # Defense in depth for MCP (the firewall already gates the console door).
      RMM_MCP_ALLOWED_IPS: ${RMM_MCP_ALLOWED_IPS:-}
      RMM_AI_BASE_URL: ${RMM_AI_BASE_URL:-https://api.openai.com/v1}
      RMM_AI_API_KEY: ${RMM_AI_API_KEY:-}
      RMM_AI_MODEL: ${RMM_AI_MODEL:-gpt-4o-mini}
      RMM_ALLOW_UNAPPROVED_JOBS: ${RMM_ALLOW_UNAPPROVED_JOBS:-false}
      RMM_REMOTE_PROVIDER: ${RMM_REMOTE_PROVIDER:-native}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - server
    volumes:
      - ../openrmm:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/dl:ro
    ports:
      # Agents door — open this port to the internet at the firewall.
      - "${AGENTS_PORT:-8443}:80"
      # Console door — restrict THIS host port to your IPs/VPN at the firewall.
      - "${CONSOLE_PORT:-9443}:81"
    restart: unless-stopped

volumes:
  rmm_pgdata:
