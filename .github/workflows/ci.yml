name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build server & agent
        run: |
          CGO_ENABLED=0 go build ./cmd/server
          CGO_ENABLED=0 go build ./cmd/agent
      - name: Cross-compile agent & sidecar (Windows)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/rmm-remote
