name: Container images

# Publishes the server and console images to GHCR.
#
# They exist so a tenant can be deployed from a registry rather than from
# somebody's laptop. That distinction is the whole point: docs/19 records
# workstation-produced release artifacts as unacceptable for production, and an
# image nobody can trace back to a commit has exactly that problem.
#
# Tags land as:
#   ghcr.io/<owner>/openrmm-server:0.5.0   (from the git tag)
#   ghcr.io/<owner>/openrmm-server:0.5     (minor, moves with patches)
#   ghcr.io/<owner>/openrmm-server:latest  (release tags only)
#   ghcr.io/<owner>/openrmm-server:main    (every push to main)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Extra tag to publish (e.g. "lab")'
        required: false
        type: string

# Least privilege, granted per job rather than repository-wide.
permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            target: server
            image: openrmm-server
          - component: frontend
            target: frontend
            image: openrmm-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag_suffix }},enable=${{ inputs.tag_suffix != '' }}
          labels: |
            org.opencontainers.image.title=OpenRMM ${{ matrix.component }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          target: ${{ matrix.target }}
          # amd64 only, deliberately. The Dockerfile compiles inside the target
          # platform's stage rather than cross-compiling, so building arm64 here
          # would run the Go toolchain under QEMU — an order of magnitude slower,
          # for minutes this project is currently rationing.
          #
          # Civo's nodes are amd64, so nothing needs the second architecture yet.
          # To add it, first teach the Dockerfile to cross-compile:
          #   FROM --platform=$BUILDPLATFORM golang AS server-build
          #   ARG TARGETARCH
          #   RUN CGO_ENABLED=0 GOOS=linux GOARCH=$TARGETARCH go build ...
          # then set platforms back to linux/amd64,linux/arm64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: without it every run recompiles the Go
          # binary and reinstalls npm, which is most of the minutes this
          # workflow costs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # What ties the image back to this commit and this workflow. Without it,
      # "which source produced this image" has no answer a third party can check
      # — the same gap that made the unsigned /dl/ artifacts a go-live blocker.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan:
    name: Vulnerability scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        image: [openrmm-server, openrmm-frontend]
    steps:
      # Scanning after publishing rather than before is deliberate: the image
      # that gets scanned must be the one that will actually be pulled, not a
      # locally built lookalike. A finding here fails the run loudly, and the
      # tag can be withdrawn.
      #
      # Runs the trivy image directly rather than the action, matching how
      # ci.yml already does it — same pinning policy, and Dependabot's docker
      # ecosystem tracks the tag.
      - name: Trivy (blocks on fixable HIGH/CRITICAL)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          REF: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.58.1 image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
              "$IMAGE:$REF"
