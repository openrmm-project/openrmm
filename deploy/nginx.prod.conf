# Production split-ingress nginx: TWO doors so a firewall / security group can
# restrict the console while agents stay reachable from untrusted networks.
#
#   - Agents door  (listen 80): ONLY the endpoints an agent needs — meant to be
#     open to the internet. Everything else returns 404, so this public door
#     never exposes the UI / REST API / MCP surface.
#   - Console door (listen 81): UI + REST API + MCP. Restrict THIS port at the
#     firewall to your office / VPN source IPs (see README-production.md). The
#     application never needs to know your allowlist.
#
# TLS is an edge concern: terminate HTTPS in front of each door (Caddy /
# Cloudflare Tunnel / your load balancer), or add `listen ... ssl` + certs here.
# Point RMM_PUBLIC_URL at the *agents* door so the remote-session relay URLs
# pushed to agents are reachable from their networks.

log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

# ------------------------------- Agents door -------------------------------
# Open to the internet. Serves only what an agent talks to; refuses the rest.
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log noquery;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Agent WebSocket (enroll / heartbeat / jobs) + native remote relay.
    location /ws/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Agent installer scripts + self-update binaries (mounted from deploy/public).
    location = /install.sh  { root /usr/share/nginx/dl; default_type text/x-shellscript; }
    location = /install.ps1 { root /usr/share/nginx/dl; default_type text/plain; }
    location /dl/           { alias /usr/share/nginx/dl/; default_type application/octet-stream; }

    location = /healthz { proxy_pass http://server:8080; }

    # Nothing else is exposed on the public door.
    location / { return 404; }
}

# ------------------------------- Console door ------------------------------
# UI + REST API + MCP. Lock THIS listener down at the firewall to your IPs/VPN
# (or leave it open if you deliberately want a public console).
server {
    listen 81;
    server_name _;
    access_log /var/log/nginx/access.log noquery;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Runtime config: point the SPA at its own origin (this console door).
    location = /config.js {
        default_type application/javascript;
        return 200 "window.__API_BASE__ = location.origin;";
    }

    # REST API. proxy_buffering off so SSE (in-app AI chat) streams.
    # NOTE: /mcp is intentionally NOT here — it has its own door below so a
    # deployer can expose MCP publicly (for cloud clients) while the console
    # stays IP-restricted, or restrict both, independently.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # /mcp lives on its own door — don't let the SPA fallback answer it here.
    location /mcp { return 404; }

    # Static SPA (no-build prototype).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------- MCP door ---------------------------------
# External MCP clients (Claude, ChatGPT, …) connect here. Serves ONLY /mcp
# (and the OAuth discovery/endpoints once Caminho B lands). Give it its own
# firewall policy: open to the internet for cloud clients (Claude web), or
# restrict to specific source IPs for known/on-prem clients — the deployer's
# choice, independent of the console. Keep RMM_MCP_ALLOWED_IPS set as an
# app-level allowlist for defense in depth.
server {
    listen 82;
    server_name _;
    access_log /var/log/nginx/access.log noquery;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /mcp {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # OAuth 2.1 authorization endpoints + discovery live here too (Caminho B):
    # /.well-known/oauth-authorization-server, /authorize, /token, /register.
    location = /healthz { proxy_pass http://server:8080; }

    # Nothing else on the MCP door.
    location / { return 404; }
}
