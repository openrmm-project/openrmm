services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmm
      # Overridable from .env, so changing it does not mean editing a tracked
      # file. The default is deliberately weak: it is a development password and
      # exists only on a developer's machine.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rmm}"
      POSTGRES_DB: rmm
    volumes:
      - rmm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: only the server (same compose network) needs Postgres.

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RMM_HTTP_ADDR: ":8080"
      # Public URL is the nginx origin (it proxies /api, /ws, /mcp).
      RMM_PUBLIC_URL: "${RMM_PUBLIC_URL:-http://localhost:3005}"
      RMM_UPDATE_PUBLIC_KEY: "${RMM_UPDATE_PUBLIC_KEY:-}"
      RMM_MCP_PUBLIC_URL: "${RMM_MCP_PUBLIC_URL:-http://localhost:3005}"
      RMM_MCP_OAUTH_ENABLED: "${RMM_MCP_OAUTH_ENABLED:-false}"
      RMM_MCP_ALLOWED_IPS: "${RMM_MCP_ALLOWED_IPS:-}"
      # The restricted role: it can append to and read audit_log and cannot
      # delete from it, so a compromised server cannot erase what it did.
      #
      # Migrations need the OWNER and therefore run separately, before this
      # starts:
      #   docker compose run --rm --no-deps \
      #     -e RMM_DATABASE_URL="postgres://rmm:rmm@postgres:5432/rmm?sslmode=disable" \
      #     server -migrate-only
      #
      # Skipping that on a version with a new migration is not silent: the
      # server refuses to start and prints the command.
      RMM_DATABASE_URL: "postgres://openrmm_app:${APP_DB_PASSWORD}@postgres:5432/rmm?sslmode=disable"
      RMM_ADMIN_TOKEN: "${RMM_ADMIN_TOKEN:-change-me-to-a-long-random-string-min32}"
      RMM_AI_BASE_URL: "${RMM_AI_BASE_URL:-https://api.openai.com/v1}"
      RMM_AI_API_KEY: "${RMM_AI_API_KEY:-}"
      RMM_AI_MODEL: "${RMM_AI_MODEL:-gpt-4o-mini}"
      RMM_ALLOW_UNAPPROVED_JOBS: "${RMM_ALLOW_UNAPPROVED_JOBS:-false}"
      RMM_REMOTE_PROVIDER: "${RMM_REMOTE_PROVIDER:-meshcentral}"
      RMM_MESHCENTRAL_URL: "${RMM_MESHCENTRAL_URL:-}"
      RMM_MESHCENTRAL_TOKEN_KEY: "${RMM_MESHCENTRAL_TOKEN_KEY:-}"
      RMM_SMTP_HOST: "${RMM_SMTP_HOST:-}"
      RMM_SMTP_PORT: "${RMM_SMTP_PORT:-587}"
      RMM_SMTP_USERNAME: "${RMM_SMTP_USERNAME:-}"
      RMM_SMTP_PASSWORD: "${RMM_SMTP_PASSWORD:-}"
      RMM_SMTP_FROM: "${RMM_SMTP_FROM:-}"
      RMM_SMTP_FROM_NAME: "${RMM_SMTP_FROM_NAME:-OpenRMM}"
      RMM_SMTP_TLS_MODE: "${RMM_SMTP_TLS_MODE:-starttls}"
      RMM_TRUST_PROXY_HEADERS: "true"
      RMM_ENFORCE_CONSOLE_RELAY_INGRESS: "true"
      RMM_ALLOW_LEGACY_AGENT_RELAY: "${RMM_ALLOW_LEGACY_AGENT_RELAY:-false}"
    expose:
      - "8080"

  frontend:
    image: openrmm-frontend:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      - server
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/public:/usr/share/nginx/dl:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /var/cache/nginx:rw,nosuid,nodev,uid=101,gid=101,mode=0750
      - /var/run:rw,nosuid,nodev,uid=101,gid=101,mode=0750
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "3005:80"

volumes:
  rmm_pgdata:
