name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  GO_VERSION: '1.26.9'

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rmm
          POSTGRES_PASSWORD: rmm
          POSTGRES_DB: rmm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rmm -d rmm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RMM_TEST_DATABASE_URL: postgres://rmm:rmm@localhost:5432/rmm_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - name: Validate tag and main ancestry
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          tag_commit="$(git rev-list -n1 "$GITHUB_REF_NAME")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git merge-base --is-ancestor "$tag_commit" origin/main
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - name: Build validation
        run: |
          CGO_ENABLED=0 go build ./cmd/server
          CGO_ENABLED=0 go build ./cmd/agent
      - name: Migration gates
        run: go test ./internal/store -run 'Test(CanonicalSchemaCopy|MigrationsPostgres)$' -count=1
      - name: Installer and operational script gates
        run: |
          bash -n deploy/public/install.sh
          shellcheck -x deploy/public/install.sh deploy/ops/*.sh
          for script in deploy/ops/*.sh; do bash -n "$script"; done
      - name: Deployment and frontend gates
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml config --quiet
          image='nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10'
          docker run --rm --add-host server:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" "$image" nginx -t
          docker run --rm --add-host server:127.0.0.1 -e OPENRMM_BASE_PATH=/ -e EDGE_SUBNET=172.30.240.0/24 -e OPENRMM_TRUSTED_PROXY=127.0.0.1 -e NGINX_ENVSUBST_FILTER='^(OPENRMM_BASE_PATH|EDGE_SUBNET|OPENRMM_TRUSTED_PROXY)$' -v "$PWD/deploy/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro" "$image" nginx -t
          npm --prefix openrmm ci
          npm --prefix openrmm test
          npm --prefix openrmm run build

  installer-windows:
    name: Windows installer gate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - name: Parse installer
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path deploy/public/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Build rmm-sign
        shell: pwsh
        run: go build -buildvcs=false -o rmm-sign.exe ./cmd/rmm-sign
      # The installer verifies Ed25519 in-process (no OpenSSL); cross-check that
      # embedded verifier against the real signer on both PowerShell editions.
      - name: Exercise embedded Ed25519 verifier (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-installer-verifier.ps1 -SignExe ./rmm-sign.exe
      - name: Exercise embedded Ed25519 verifier (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-installer-verifier.ps1 -SignExe ./rmm-sign.exe

  installer-macos:
    name: macOS installer gate
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - run: brew install openssl@3 shellcheck
      - name: Validate installer
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          openssl version | grep -E '^OpenSSL ([3-9]|[1-9][0-9])\.'
          bash -n deploy/public/install.sh
          shellcheck deploy/public/install.sh
          tmp="$(mktemp -d)"
          go build -buildvcs=false -o "$tmp/rmm-sign" ./cmd/rmm-sign
          keys="$("$tmp/rmm-sign" -gen-key)"
          public_line="${keys%%$'\n'*}"
          private_line="${keys#*$'\n'}"
          public_key="${public_line#*=}"
          export RMM_SIGNING_KEY="${private_line#*=}"
          printf 'macOS installer signature test' > "$tmp/artifact"
          "$tmp/rmm-sign" "$tmp/artifact" >/dev/null
          read -r format signature < "$tmp/artifact.sig"
          test "$format" = rmm-ed25519-sha256-v1
          printf '\060\052\060\005\006\003\053\145\160\003\041\000' > "$tmp/public.der"
          printf '%s' "$public_key" | openssl base64 -d -A >> "$tmp/public.der"
          printf '%s' "$signature" | openssl base64 -d -A > "$tmp/signature.bin"
          openssl dgst -sha256 -binary "$tmp/artifact" > "$tmp/artifact.digest"
          openssl pkeyutl -verify -pubin -inkey "$tmp/public.der" -keyform DER -rawin -in "$tmp/artifact.digest" -sigfile "$tmp/signature.bin"

  portable:
    name: Portable release binaries
    needs: [gates, installer-windows, installer-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RMM_UPDATE_PUBLIC_KEY: ${{ secrets.RMM_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - run: test -n "$RMM_UPDATE_PUBLIC_KEY"
      - name: Build agents and CGO-free sidecars
        run: |
          make dist-clean
          make VERSION="${GITHUB_REF_NAME}" agent-dist
          make remote-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-binaries
          path: |
            deploy/public/rmm-agent-*
            deploy/public/rmm-remote-*

  macos-sidecar:
    name: macOS sidecar (arm64 + amd64)
    needs: [gates, installer-windows, installer-macos]
    permissions:
      contents: read
    # One Apple Silicon runner builds both. Intel was dropped from the release
    # when the macos-13 runners started queueing for ~24h and being cancelled,
    # which blocked `publish` entirely — but an Intel RUNNER was never the only
    # way to get an Intel binary: Xcode's SDK is universal, so clang cross-builds
    # x86_64 from here. CI has been doing exactly that for every PR, so the
    # release was shipping less than CI proved buildable, and Intel Macs were
    # left with no remote module at all.
    runs-on: macos-14
    timeout-minutes: 30
    env:
      APPLE_SIGNING_P12: ${{ secrets.APPLE_SIGNING_P12 }}
      APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
      RMM_MACOS_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      # The macOS signing identity, when the repository has one. Without it the
      # bundle is ad-hoc signed exactly as before, so forks and PRs still build.
      #
      # A persistent identity is what makes a sidecar update keep its privacy
      # grants: macOS ties Screen Recording and Accessibility to the code
      # identity, and an ad-hoc signature changes it on every build, so each
      # release asks the operator for permission again.
      - name: Import the signing identity
        if: env.APPLE_SIGNING_P12 != ''
        run: |
          set -eu
          keychain="$RUNNER_TEMP/openrmm-signing.keychain-db"
          # Random, ephemeral, and never leaves the runner: it only protects a
          # keychain that is deleted when the job ends.
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$APPLE_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # Without this, codesign blocks on a GUI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
      - name: Build and package macOS remote modules
        run: |
          set -eux
          plist=cmd/rmm-remote/macapp/Info.plist
          ldflags="-extldflags -Wl,-sectcreate,__TEXT,__info_plist,$plist"
          # The oldest macOS the sidecar supports (Go's own floor), rather than
          # the runner's release: see the matching step in ci.yml.
          export MACOSX_DEPLOYMENT_TARGET=12.0
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -buildvcs=false -ldflags "$ldflags" -o rmm-remote-darwin-arm64 ./cmd/rmm-remote
          # Cross-built here, not on an Intel runner: -arch x86_64 selects the
          # slice of the same universal SDK. It cannot be executed on this
          # machine, which is why the job verifies the architecture instead of
          # running it.
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -buildvcs=false -ldflags "$ldflags" -o rmm-remote-darwin-amd64 ./cmd/rmm-remote
          for arch in arm64 amd64; do
            scripts/build-macos-bundle.sh "$arch" "rmm-remote-darwin-$arch" "rmm-remote-darwin-$arch.app.tar.gz"
          done
      - name: Verify both slices are what they claim
        run: |
          set -eux
          # A cross-build that silently produced two arm64 binaries would ship an
          # Intel release that no Intel Mac can start, and nothing downstream
          # would notice: the bundle unpacks, the signature verifies, and the
          # sidecar simply never runs.
          file rmm-remote-darwin-arm64 | grep -q 'arm64'
          file rmm-remote-darwin-amd64 | grep -q 'x86_64'
          # And that they start on the oldest macOS the release claims to support.
          vtool -show-build rmm-remote-darwin-arm64 | grep -qE 'minos 12\.0$'
          vtool -show-build rmm-remote-darwin-amd64 | grep -qE 'minos 12\.0$'
          for arch in arm64 amd64; do
            tar -tzf "rmm-remote-darwin-$arch.app.tar.gz" | grep -q 'RMMRemote.app/Contents/MacOS/rmm-remote'
          done
      # A silent fall back to ad-hoc signing is the failure worth catching here:
      # the bundle still builds, still verifies, still installs — and every Mac
      # in the fleet is asked for its privacy permissions again, because macOS
      # sees a different application. Nothing downstream would notice.
      - name: The bundle must carry the persistent identity
        if: env.APPLE_SIGNING_P12 != ''
        run: |
          set -eux
          work="$(mktemp -d)"
          tar -xzf rmm-remote-darwin-arm64.app.tar.gz -C "$work"
          app="$work/RMMRemote.app"
          # Both streams: codesign splits its output between them in ways that
          # differ by subcommand, and a capture that lands empty would make the
          # ad-hoc test below pass by finding nothing — the exact failure this
          # step exists to catch.
          codesign -dvv "$app" > "$work/info" 2>&1
          test -s "$work/info"
          if grep -q 'Signature=adhoc' "$work/info"; then
            echo "the bundle is ad-hoc signed: the identity was not used" >&2
            exit 1
          fi
          # Written by the bundle script only when a real identity signed it.
          test -f "$app/Contents/Resources/StableCodeIdentity"
          # The designated requirement has to follow the CERTIFICATE. A cdhash
          # requirement is bound to one build, which is the whole problem.
          #
          # "root" and "leaf" are both right, and which one appears says what
          # signed it: a self-signed certificate IS the root of its own chain,
          # while a Developer ID leaf sits under Apple's anchor. Asserting only
          # "leaf" failed against a self-signed identity that had in fact signed
          # correctly — so the assertion accepts either and rejects what actually
          # matters, a requirement bound to this build's hash.
          codesign -d -r- "$app" > "$work/req" 2>&1
          test -s "$work/req"
          grep -qE 'certificate (root|leaf)' "$work/req"
          if grep -q 'cdhash' "$work/req"; then
            echo "the requirement is bound to this build, not to the certificate" >&2
            exit 1
          fi
      # The opt-out variant must really opt out. Ungated: it is built with or
      # without a signing identity, and an ad-hoc bundle that still carried the
      # certificate's marker would make the agent believe grants survive that
      # macOS has already dropped.
      - name: The ad-hoc variant must carry no identity
        run: |
          set -eux
          for arch in arm64 amd64; do
            work="$(mktemp -d)"
            tar -xzf "rmm-remote-darwin-$arch.adhoc.app.tar.gz" -C "$work"
            app="$work/RMMRemote.app"
            codesign -dvv "$app" > "$work/info" 2>&1
            test -s "$work/info"
            grep -q 'Signature=adhoc' "$work/info"
            grep -q 'Identifier=io.openrmm.remote' "$work/info"
            test ! -e "$app/Contents/Resources/StableCodeIdentity"
          done
      - name: Remove the signing keychain
        if: always() && env.APPLE_SIGNING_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/openrmm-signing.keychain-db" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-sidecar
          # fail on a missing file: an absent ad-hoc archive would publish a
          # release in which --macos-bundle adhoc finds nothing to install.
          if-no-files-found: error
          path: |
            rmm-remote-darwin-arm64
            rmm-remote-darwin-arm64.app.tar.gz
            rmm-remote-darwin-arm64.adhoc.app.tar.gz
            rmm-remote-darwin-amd64
            rmm-remote-darwin-amd64.app.tar.gz
            rmm-remote-darwin-amd64.adhoc.app.tar.gz

  publish:
    name: Sign, attest and publish
    needs: [portable, macos-sidecar]
    runs-on: ubuntu-latest
    # Gates the only job that reads the private signing key behind a protected
    # GitHub Environment. Configure "release" with required reviewers and a branch
    # rule restricting it to tags, so publishing a signed release needs approval.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RMM_UPDATE_PUBLIC_KEY: ${{ secrets.RMM_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-binaries'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'macos-sidecar'
          path: release
          merge-multiple: true
      - name: Assemble unsigned release
        run: |
          test -n "$RMM_UPDATE_PUBLIC_KEY"
          cp deploy/public/install.sh deploy/public/install.ps1 deploy/public/uninstall.sh release/
          go build -buildvcs=false -o rmm-sign ./cmd/rmm-sign
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate SBOM and checksums
        run: |
          syft dir:release -o spdx-json=release/SBOM.spdx.json
          (cd release && sha256sum rmm-agent-* rmm-remote-* install.sh install.ps1 uninstall.sh SBOM.spdx.json > SHA256SUMS)
      - name: Sign release artifacts
        env:
          RMM_SIGNING_KEY: ${{ secrets.RMM_SIGNING_KEY }}
        run: |
          test -n "$RMM_SIGNING_KEY"
          test "$(./rmm-sign -print-public-key)" = "$RMM_UPDATE_PUBLIC_KEY"
          ./rmm-sign release/rmm-agent-* release/rmm-remote-* release/SHA256SUMS
      # Build-provenance attestation is unavailable for user-owned private repos
      # on the Free plan ("Feature not available for user-owned private
      # repositories"). Keep it non-blocking so the signed release still
      # publishes; it starts producing provenance automatically once the repo is
      # public. The Ed25519 .sig files remain the enforced update-integrity check.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: 'release/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: release/*
      # Handed to the artifacts-image job below, which has registry access and
      # no signing key. The files are already signed; that job only packages them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # The image a Kubernetes tenant serves /dl/ from (charts/openrmm, artifacts.*).
  # Built here and not in "Container images": its content is the signed release,
  # which exists only after the publish job, and a tenant pinned to vX.Y.Z must
  # get exactly the files published as vX.Y.Z. A separate job so the registry
  # token and the signing key never share one.
  artifacts-image:
    name: Artifacts image
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Over the tracked installers, so the image carries the very bytes that
      # SHA256SUMS and its signature describe.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: deploy/public
      - name: Every binary arrives with its signature
        run: |
          cd deploy/public
          test -f SHA256SUMS.sig
          for f in rmm-agent-* rmm-remote-*; do
            case "$f" in *.sig) continue ;; esac
            test -f "$f.sig" || { echo "missing $f.sig"; exit 1; }
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/openrmm-artifacts
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OpenRMM update artifacts
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: artifacts
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
