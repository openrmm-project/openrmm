log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log noquery;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Runtime config: point the SPA at its own origin (nginx proxies the API).
    location = /config.js {
        default_type application/javascript;
        return 200 "window.__API_BASE__ = location.origin;";
    }

    # API + health -> server. proxy_buffering off so SSE (AI chat / MCP) streams.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /mcp {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /healthz { proxy_pass http://server:8080; }

    # WebSocket: agent connection + native remote relay.
    location /ws/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Agent installer script + agent binary downloads (mounted from deploy/public).
    location = /install.sh {
        root /usr/share/nginx/dl;
        default_type text/x-shellscript;
    }
    location = /install.ps1 {
        root /usr/share/nginx/dl;
        default_type text/plain;
    }
    location /dl/ {
        alias /usr/share/nginx/dl/;
        default_type application/octet-stream;
    }

    # Static SPA (no-build prototype).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
