name: Database migrations

env:
  GO_VERSION: '1.26.6'

# Same reasoning as ci.yml: a superseded pull-request run is wasted budget, a
# run on main is the one that says whether main is good.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'internal/store/**'
      - 'internal/settings/**'
      - 'internal/api/**'
      - 'internal/notify/**'
      - 'internal/ai/**'
      - 'internal/mcpserver/**'
      - 'internal/patches/**'
      - 'internal/scheduler/**'
      - 'db/schema.sql'
      - 'cmd/server/main.go'
      - '.github/workflows/migrations.yml'
  pull_request:
    paths:
      - 'internal/store/**'
      - 'internal/settings/**'
      - 'internal/api/**'
      - 'internal/notify/**'
      - 'internal/ai/**'
      - 'internal/mcpserver/**'
      - 'internal/patches/**'
      - 'internal/scheduler/**'
      - 'db/schema.sql'
      - 'cmd/server/main.go'
      - '.github/workflows/migrations.yml'

jobs:
  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rmm
          POSTGRES_PASSWORD: rmm
          POSTGRES_DB: rmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmm -d rmm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RMM_TEST_DATABASE_URL: postgres://rmm:rmm@localhost:5432/rmm_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      # Whole packages, not an allowlist of test names: every DB-backed test
      # skips silently without RMM_TEST_DATABASE_URL, so a named pattern means a
      # new integration test is added, passes locally, and never runs here again.
      # Postgres is already provisioned above; running the unit tests alongside
      # it costs nothing.
      #
      # The package list has the same failure mode as a test-name list, and had
      # already bitten: settings and api grew DB-backed tests that ran nowhere,
      # because neither the list below nor the path filter above mentioned them.
      # A DB-backed test in a package that is not listed here does not exist.
      # It bit again: ai, mcpserver, patches and scheduler all had DB-backed
      # tests — the AI's proposal and scope guarantees among them — that CI had
      # never run. Every package that reads RMM_TEST_DATABASE_URL belongs here:
      #   grep -rl RMM_TEST_DATABASE_URL --include=*_test.go internal | xargs -n1 dirname | sort -u
      - run: go test ./internal/store ./internal/settings ./internal/api ./internal/notify ./internal/ai ./internal/mcpserver ./internal/patches ./internal/scheduler -count=1
