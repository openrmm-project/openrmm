server_tokens off;

log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;
# The pinned standard nginx image has no Brotli module; enabling its directives
# would make startup fail. Gzip is therefore the available compression path.

# TLS and source-IP ACLs belong to the trusted edge in the default loopback
# topology.
#
# The client address. The edge reaches these listeners through a published
# port, so the TCP peer nginx sees is the edge — or Docker's gateway on the edge
# network in front of it — never the client. Recording that peer would give
# every client the same address, and the server's per-address limits would
# lock the whole console out after a handful of failed logins anywhere, and
# make RMM_MCP_ALLOWED_IPS see only the edge. So X-Forwarded-For is taken, and
# only from peers on the edge network (EDGE_SUBNET) or the one extra edge host
# named by OPENRMM_TRUSTED_PROXY. real_ip_recursive skips trusted hops from the
# right, so a value a client injected in front of the edge's is never chosen.
# Every location below then forwards that single resolved address.
set_real_ip_from ${EDGE_SUBNET};
set_real_ip_from ${OPENRMM_TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Agents door: only agent WebSockets, installers, artifacts and liveness.
server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log noquery;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location /ws/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-RMM-Relay-Ingress "agents";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /install.sh  { root /usr/share/nginx/dl; default_type text/x-shellscript; }
    location = /install.ps1 { root /usr/share/nginx/dl; default_type text/plain; }
    location /dl/           { alias /usr/share/nginx/dl/; default_type application/octet-stream; }
    location = /healthz     { proxy_pass http://server:8080; access_log off; }
    location /              { return 404; }
}

# Console door: SPA, REST API and browser relay only.
server {
    listen 8081;
    server_name _;
    access_log /var/log/nginx/access.log noquery;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # app.js/app.css/styles.css are currently stable names, so all console files
    # remain no-store. Switch only hash-named files to immutable when emitted.
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location = /frontend-healthz {
        access_log off;
        try_files ${OPENRMM_BASE_PATH}index.html =503;
    }

    location = ${OPENRMM_BASE_PATH}config.js {
        default_type application/javascript;
        return 200 "window.__API_BASE__ = location.origin;\n";
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /ws/remote {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-RMM-Relay-Ingress "console";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /mcp { return 404; }

    # Static-looking misses must never receive the SPA HTML fallback.
    location ~* \.(?:css|gif|ico|jpe?g|js|json|map|png|svg|webp|woff2?)$ {
        try_files $uri =404;
    }

    location ${OPENRMM_BASE_PATH} {
        try_files $uri $uri/ ${OPENRMM_BASE_PATH}index.html;
    }
}

# MCP door: MCP and its OAuth endpoints only.
server {
    listen 8082;
    server_name _;
    access_log /var/log/nginx/access.log noquery;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location /mcp {
        proxy_pass http://server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /.well-known/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /oauth/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }

    location = /healthz { proxy_pass http://server:8080; access_log off; }
    location /          { return 404; }
}
