name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the previous run pointless, and each full
# run bills ~31 minutes. Merges into main are never cancelled: that run is the
# one that says whether main is good.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26.10'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      installers: ${{ steps.filter.outputs.installers }}
      docker: ${{ steps.filter.outputs.docker }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Work out which areas the change touches
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No usable base (first push of a branch, forced update, re-run of an
          # old event): assume everything changed. Skipping a job we should have
          # run is the failure that costs more than the minutes it saves.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable diff base — running everything"
            printf 'go=true\nfrontend=true\ninstallers=true\ndocker=true\nmacos=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "changed files:"; echo "$files"
          has() { echo "$files" | grep -qE "$1"; }
          go=false; frontend=false; installers=false; docker=false; macos=false
          has '^(cmd/|internal/|go\.(mod|sum)$)'                  && go=true
          # The macOS jobs are billed at ten times a Linux minute and rounded up,
          # so they stay off pull requests that cannot affect them. A change that
          # CAN is worth the ten minutes: both defects found on main the first
          # time these ran — an ad-hoc bundle having no designated requirement,
          # and chown rejecting nobody's uid on BSD — were in files matched here.
          has '(_darwin\.(go|m)$|^cmd/rmm-remote/macapp/|^scripts/build-macos-bundle\.sh$|^scripts/test-install-migration\.sh$|^deploy/public/(install|uninstall)\.sh$)' && macos=true
          has '^openrmm/'                                          && frontend=true
          has '^(deploy/public/install\.|scripts/|cmd/agent/|internal/protocol/)' && installers=true
          has '^(Dockerfile$|\.dockerignore$|deploy/)'             && docker=true
          # A change to the workflows themselves has to be proven by running them.
          if has '^\.github/workflows/'; then
            go=true; frontend=true; installers=true; docker=true; macos=true
          fi
          printf 'go=%s\nfrontend=%s\ninstallers=%s\ndocker=%s\nmacos=%s\n' "$go" "$frontend" "$installers" "$docker" "$macos" | tee -a "$GITHUB_OUTPUT"

  go:
    name: Go vet, race, test and build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - run: go mod verify
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - name: Build and cross-compile release targets
        run: |
          CGO_ENABLED=0 go build ./cmd/server
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./cmd/agent
          done
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./cmd/rmm-remote
          done

  platform:
    name: Agent test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS is billed at ten times a Linux minute and each job is rounded up,
        # so a 14-second run costs ten. It runs on main, and on a pull request
        # only when the change can actually affect it — which is what makes a
        # macOS defect visible before the merge rather than after.
        os: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - run: go test ./cmd/agent ./internal/protocol -count=1
      - if: runner.os != 'macOS'
        run: go test ./cmd/rmm-remote -count=1

  macos-remote:
    name: macOS native chat and remote sidecar
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-14
    # The same signing identity the release uses, so the bundle this job
    # publishes as an artifact is the one operators can actually install without
    # re-granting permissions. Absent — on a fork, or before one exists — the
    # bundle stays ad-hoc signed and everything still builds.
    env:
      APPLE_SIGNING_P12: ${{ secrets.APPLE_SIGNING_P12 }}
      APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
      RMM_MACOS_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: CGO_ENABLED=1 go test ./cmd/rmm-remote
      # A command-line tool has no Info.plist, so macOS has no bundle identity to
      # attribute a privacy request to and no purpose string to show — it neither
      # prompts nor lists the tool, and the operator has nothing to allow. On
      # macOS 15 that surfaces as a denied LOCAL NETWORK access: the sidecar
      # cannot reach the relay and reports "no route to host". Embedding the
      # plist in __TEXT,__info_plist helps identify a bare tool, but privacy
      # grants for the shipped sidecar rely on the application bundle. Ad-hoc
      # signing changes identity on rebuild and cannot preserve those grants.
      - name: Import the signing identity
        if: env.APPLE_SIGNING_P12 != ''
        run: |
          set -eu
          keychain="$RUNNER_TEMP/openrmm-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$APPLE_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # Without this, codesign blocks on a GUI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
      - name: Build, bundle and sign the darwin sidecars
        run: |
          set -eux
          PLIST=cmd/rmm-remote/macapp/Info.plist
          LD="-extldflags -Wl,-sectcreate,__TEXT,__info_plist,$PLIST"
          # The oldest macOS the sidecar supports (Go's own floor). Left to the
          # runner, clang targets the runner's release: the binary then refuses
          # to start on older Macs, and a macOS 15 runner fails the build
          # because its SDK hides CGDisplayCreateImage.
          export MACOSX_DEPLOYMENT_TARGET=12.0
          CGO_ENABLED=1 go build -buildvcs=false -ldflags "$LD" -o dist/rmm-remote-darwin-arm64 ./cmd/rmm-remote
          # The runner is arm64; Xcode's SDK is universal, so -arch x86_64 gives
          # the Intel build that /dl/ has never carried. It cannot run here.
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -buildvcs=false -ldflags "$LD" -o dist/rmm-remote-darwin-amd64 ./cmd/rmm-remote
          # Bundle assembly lives in a script so this job and `make
          # remote-dist-darwin` cannot drift apart.
          for arch in arm64 amd64; do
            scripts/build-macos-bundle.sh "$arch" "dist/rmm-remote-darwin-$arch" "dist/rmm-remote-darwin-$arch.app.tar.gz"
          done
          ls -la dist/
      - run: dist/rmm-remote-darwin-arm64 -print-version
      - run: file dist/rmm-remote-darwin-amd64
      - name: Both slices start on macOS 12
        run: |
          set -eux
          for arch in arm64 amd64; do
            vtool -show-build "dist/rmm-remote-darwin-$arch" | grep -qE 'minos 12\.0$'
          done
      # A silent fall back to ad-hoc signing is the failure worth catching here:
      # the bundle still builds, still verifies, still installs — and every Mac
      # in the fleet is asked for its privacy permissions again, because macOS
      # sees a different application. Nothing downstream would notice.
      - name: The bundle must carry the persistent identity
        if: env.APPLE_SIGNING_P12 != ''
        run: |
          set -eux
          work="$(mktemp -d)"
          tar -xzf dist/rmm-remote-darwin-arm64.app.tar.gz -C "$work"
          app="$work/RMMRemote.app"
          # Both streams: codesign splits its output between them in ways that
          # differ by subcommand, and a capture that lands empty would make the
          # ad-hoc test below pass by finding nothing — the exact failure this
          # step exists to catch.
          codesign -dvv "$app" > "$work/info" 2>&1
          test -s "$work/info"
          if grep -q 'Signature=adhoc' "$work/info"; then
            echo "the bundle is ad-hoc signed: the identity was not used" >&2
            exit 1
          fi
          # Written by the bundle script only when a real identity signed it.
          test -f "$app/Contents/Resources/StableCodeIdentity"
          # The designated requirement has to follow the CERTIFICATE. A cdhash
          # requirement is bound to one build, which is the whole problem.
          #
          # "root" and "leaf" are both right, and which one appears says what
          # signed it: a self-signed certificate IS the root of its own chain,
          # while a Developer ID leaf sits under Apple's anchor. Asserting only
          # "leaf" failed against a self-signed identity that had in fact signed
          # correctly — so the assertion accepts either and rejects what actually
          # matters, a requirement bound to this build's hash.
          codesign -d -r- "$app" > "$work/req" 2>&1
          test -s "$work/req"
          grep -qE 'certificate (root|leaf)' "$work/req"
          if grep -q 'cdhash' "$work/req"; then
            echo "the requirement is bound to this build, not to the certificate" >&2
            exit 1
          fi
      # The opt-out variant must really opt out. Ungated: it is built with or
      # without a signing identity, and an ad-hoc bundle that still carried the
      # certificate's marker would make the agent believe grants survive that
      # macOS has already dropped.
      - name: The ad-hoc variant must carry no identity
        run: |
          set -eux
          for arch in arm64 amd64; do
            work="$(mktemp -d)"
            tar -xzf "dist/rmm-remote-darwin-$arch.adhoc.app.tar.gz" -C "$work"
            app="$work/RMMRemote.app"
            codesign -dvv "$app" > "$work/info" 2>&1
            test -s "$work/info"
            grep -q 'Signature=adhoc' "$work/info"
            grep -q 'Identifier=io.openrmm.remote' "$work/info"
            test ! -e "$app/Contents/Resources/StableCodeIdentity"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmm-remote-darwin
          path: dist/rmm-remote-darwin-*
          retention-days: 7
      - name: Remove the signing keychain
        if: always() && env.APPLE_SIGNING_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/openrmm-signing.keychain-db" || true

  installers-linux:
    name: Linux installer validation
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax and lint
        run: |
          bash -n deploy/public/install.sh deploy/public/uninstall.sh scripts/test-install-migration.sh
          shellcheck -x deploy/public/install.sh deploy/public/uninstall.sh scripts/test-install-migration.sh deploy/ops/*.sh
          for script in deploy/ops/*.sh; do bash -n "$script"; done
      # Installs into the runner's real system paths, which is why it only runs
      # on a throwaway machine. It covers the installer's transaction, the
      # directory-ownership refusal and uninstall.sh; the agent is a stand-in,
      # since CI has no server for a real one to enrol against.
      - name: Installer transaction and uninstall
        run: sudo bash scripts/test-install-migration.sh
      - name: PowerShell static validation
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $scripts = @('deploy/public/install.ps1', 'cmd/agent/uninstall_windows.ps1') + (Get-ChildItem scripts/*.ps1 | ForEach-Object { $_.FullName })
          foreach ($script in $scripts) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { Write-Host $script; $errors | Format-List; exit 1 }
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
          # One path at a time: the positional parameter is -ScriptDefinition, so
          # an array binds to it as a string and the call fails before analysing.
          foreach ($script in $scripts) {
            $findings = Invoke-ScriptAnalyzer -Path $script -Severity Error
            if ($findings) { Write-Host $script; $findings | Format-Table; exit 1 }
          }

  installer-windows:
    name: Windows installer verification
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - name: Parse and analyze installer
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          $scripts = @('deploy/public/install.ps1', 'cmd/agent/uninstall_windows.ps1') + (Get-ChildItem scripts/*.ps1 | ForEach-Object { $_.FullName })
          foreach ($script in $scripts) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { Write-Host $script; $errors | Format-List; exit 1 }
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
          # One path at a time: the positional parameter is -ScriptDefinition, so
          # an array binds to it as a string and the call fails before analysing.
          foreach ($script in $scripts) {
            $findings = Invoke-ScriptAnalyzer -Path $script -Severity Error
            if ($findings) { Write-Host $script; $findings | Format-Table; exit 1 }
          }
      - name: Build rmm-sign
        shell: pwsh
        run: go build -buildvcs=false -o rmm-sign.exe ./cmd/rmm-sign
      - name: Orphaned service ownership (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-windows-service-reinstall.ps1
      - name: Agent directory ACL (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-installer-acl.ps1
      # The installer verifies Ed25519 signatures in-process (no OpenSSL). These
      # steps cross-check that embedded verifier against the real signer on both
      # PowerShell editions: 7 (.NET) and Windows PowerShell 5.1 (.NET Framework,
      # which needs System.Numerics referenced explicitly).
      - name: Embedded Ed25519 verifier (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-installer-verifier.ps1 -SignExe ./rmm-sign.exe
      - name: Embedded Ed25519 verifier (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-installer-verifier.ps1 -SignExe ./rmm-sign.exe

  installer-macos:
    name: macOS installer validation
    needs: changes
    # Same rule as the agent test: always on main, and on a pull request when the
    # change touches something macOS-specific. The BSD-only defects this job
    # exists to catch are invisible everywhere else.
    if: needs.changes.outputs.installers == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Take the newest patch of that minor. Without this, setup-go reuses the
          # Go baked into the runner image, which is how CI kept building on a
          # release that already had published security fixes.
          check-latest: true
      - name: Install validation prerequisites
        run: brew install openssl@3 shellcheck
      - name: Validate installer with macOS tools
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          openssl version | grep -E '^OpenSSL ([3-9]|[1-9][0-9])\.'
          bash -n deploy/public/install.sh deploy/public/uninstall.sh
          shellcheck deploy/public/install.sh deploy/public/uninstall.sh
          tmp="$(mktemp -d)"
          go build -buildvcs=false -o "$tmp/rmm-sign" ./cmd/rmm-sign
          keys="$("$tmp/rmm-sign" -gen-key)"
          public_line="${keys%%$'\n'*}"
          private_line="${keys#*$'\n'}"
          public_key="${public_line#*=}"
          export RMM_SIGNING_KEY="${private_line#*=}"
          printf 'macOS installer signature test' > "$tmp/artifact"
          "$tmp/rmm-sign" "$tmp/artifact" >/dev/null
          read -r format signature < "$tmp/artifact.sig"
          test "$format" = rmm-ed25519-sha256-v1
          printf '\060\052\060\005\006\003\053\145\160\003\041\000' > "$tmp/public.der"
          printf '%s' "$public_key" | openssl base64 -d -A >> "$tmp/public.der"
          printf '%s' "$signature" | openssl base64 -d -A > "$tmp/signature.bin"
          openssl dgst -sha256 -binary "$tmp/artifact" > "$tmp/artifact.digest"
          openssl pkeyutl -verify -pubin -inkey "$tmp/public.der" -keyform DER -rawin -in "$tmp/artifact.digest" -sigfile "$tmp/signature.bin"
      # The one platform where the agent moves out of /usr/local/bin, and the
      # only place the installer's BSD stat syntax is exercised.
      - name: Installer migration and uninstall
        run: sudo bash scripts/test-install-migration.sh

  # THIRD_PARTY_NOTICES reproduces the licence of every module and npm package
  # OpenRMM ships, and has to change when they do.
  notices:
    name: Third-party notices
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
        working-directory: openrmm
      - run: go mod download
      - run: go run ./cmd/notices -check

  frontend:
    name: Frontend npm validation
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openrmm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm test
      - run: npm run build

  deployment-config:
    name: Production deployment validation
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose with both environment examples
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml config --quiet
      - name: Validate nginx configurations
        run: |
          image='nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10'
          docker run --rm --add-host server:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" "$image" nginx -t
          docker run --rm --add-host server:127.0.0.1 -e OPENRMM_BASE_PATH=/ -e EDGE_SUBNET=172.30.240.0/24 -e OPENRMM_TRUSTED_PROXY=127.0.0.1 -e NGINX_ENVSUBST_FILTER='^(OPENRMM_BASE_PATH|EDGE_SUBNET|OPENRMM_TRUSTED_PROXY)$' -v "$PWD/deploy/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro" "$image" nginx -t
      # The published images, run the way deploy/QUICKSTART.md runs them: the
      # layered Compose files parse, the Caddyfile is valid, and the stack comes
      # up from ghcr.io and answers on all three doors, down to a first-admin
      # bootstrap that crosses nginx, the server and PostgreSQL.
      - name: Published images (deploy/QUICKSTART.md)
        working-directory: deploy
        run: |
          set -euo pipefail
          # The release key, as QUICKSTART.md tells people to set it: one source,
          # and a key the guide gets wrong fails here.
          RELEASE_KEY=$(sed -n 's/^RMM_UPDATE_PUBLIC_KEY=\([A-Za-z0-9+/=]\{44\}\)$/\1/p' QUICKSTART.md)
          test -n "$RELEASE_KEY"
          cp .env.example .env
          sed -i "s|^RMM_UPDATE_PUBLIC_KEY=.*|RMM_UPDATE_PUBLIC_KEY=$RELEASE_KEY|" .env
          printf '%s\n' AGENTS_HOST=agents.example.test CONSOLE_HOST=console.example.test \
            MCP_HOST=mcp.example.test ACME_EMAIL=ops@example.test >> .env
          files=(-f docker-compose.prod.yml -f docker-compose.images.yml)
          docker compose "${files[@]}" -f docker-compose.caddy.yml config --quiet
          caddy=$(docker compose "${files[@]}" -f docker-compose.caddy.yml config --format json | jq -r .services.caddy.image)
          docker run --rm -e AGENTS_HOST=agents.example.test -e CONSOLE_HOST=console.example.test \
            -e MCP_HOST=mcp.example.test -e ACME_EMAIL=ops@example.test \
            -e 'CONSOLE_ALLOWED_RANGES=0.0.0.0/0 ::/0' -e 'MCP_ALLOWED_RANGES=0.0.0.0/0 ::/0' \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          ops/provision-secrets.sh >/dev/null
          docker compose "${files[@]}" up -d
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8443/healthz >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:9443/frontend-healthz >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:8443/healthz >/dev/null
          # Each body is read whole before it is checked: piped into a reader that
          # stops early (head, grep -q), curl was left writing into a closed pipe
          # and pipefail failed the step with curl's exit 23.
          sums=$(curl -fsS http://127.0.0.1:8443/dl/SHA256SUMS)
          grep -q rmm-agent-linux-amd64 <<<"$sums"
          script=$(curl -fsS http://127.0.0.1:8443/install.sh)
          [[ $script == '#!'* ]]
          page=$(curl -fsS http://127.0.0.1:9443/index.html)
          grep -qi '<html' <<<"$page"
          curl -fsS http://127.0.0.1:7443/healthz >/dev/null
          # A password the server's rules accept: 12+ characters, an uppercase
          # letter and a symbol.
          code=$(curl -sS -o bootstrap.json -w '%{http_code}' -X POST http://127.0.0.1:9443/api/auth/bootstrap \
            -H "Authorization: Bearer $(cat secrets/admin_token)" -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"Ci-Only-Password-1234!"}')
          test "$code" = 201 || { echo "bootstrap answered $code: $(jq -r .error bootstrap.json 2>/dev/null)"; exit 1; }
      - name: Published images, state on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.images.yml ps -a
          docker compose -f docker-compose.prod.yml -f docker-compose.images.yml logs --no-color --tail 80

  container-scan:
    name: Container image vulnerability scan
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build server and frontend images
        run: |
          docker build --target server   -t rmm-server:ci .
          docker build --target frontend -t rmm-frontend:ci .
      - name: Scan images with Trivy (blocks on fixable HIGH/CRITICAL)
        run: |
          # NOTE: pin aquasec/trivy by @sha256 digest to match the repo's
          # action/image pinning policy (Dependabot's docker ecosystem tracks it).
          trivy='aquasec/trivy:0.58.1'
          for img in rmm-server:ci rmm-frontend:ci; do
            echo "::group::Trivy $img"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              "$trivy" image \
                --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
                "$img"
            echo "::endgroup::"
          done
