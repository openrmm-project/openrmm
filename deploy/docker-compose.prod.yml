name: openrmm

# Image defaults are patch- and digest-pinned. Override only as part of an
# explicit, tested image update.
x-security: &security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297}
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmm}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-rmm}
    secrets:
      - postgres_password
    # Continuous WAL archiving is what turns "we lose up to a day" into "we lose
    # up to POSTGRES_ARCHIVE_TIMEOUT". archive_timeout forces a segment switch on
    # an idle database — without it a low-traffic install can sit on an unarchived
    # segment for hours and the real RPO is nothing like the configured one.
    # A base backup (deploy/ops/basebackup.sh) is required to replay these; the
    # logical dump from backup.sh cannot consume WAL.
    # List form, not a folded block: "%p %f" must reach postgres as part of one
    # argv entry. A folded scalar splits on whitespace and postgres then sees two
    # stray arguments and refuses to start.
    command:
      - postgres
      # The image's generated pg_hba only allows replication from localhost, so
      # a warm standby is rejected until this explicit file is in play.
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=on
      - -c
      - "archive_command=/usr/local/bin/archive-wal.sh %p %f"
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300}
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=${POSTGRES_MAX_WAL_SENDERS:-5}
      - -c
      - wal_keep_size=${POSTGRES_WAL_KEEP_SIZE:-512MB}
    volumes:
      - rmm_pgdata:/var/lib/postgresql/data
      - rmm_pgwal:/var/lib/postgresql/wal-archive
      - ./postgres/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,uid=70,gid=70,mode=0770
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    stop_grace_period: 60s
    <<: *security

  server:
    image: ${SERVER_IMAGE:-openrmm-server:local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.26.0-alpine@sha256:d4c4845f5d60c6a974c6000ce58ae079328d03ab7f721a0734277e69905473e5}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b}
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RMM_HTTP_ADDR: ":8080"
      RMM_PUBLIC_URL: ${RMM_PUBLIC_URL:?set the public HTTPS agents URL}
      RMM_MCP_PUBLIC_URL: ${RMM_MCP_PUBLIC_URL:-}
      RMM_DATABASE_URL: "postgres://${POSTGRES_USER:-rmm}@postgres:5432/${POSTGRES_DB:-rmm}?sslmode=disable"
      RMM_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      RMM_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      RMM_SETTINGS_ENCRYPTION_KEY_FILE: /run/secrets/settings_encryption_key
      RMM_REQUIRE_SETTINGS_ENCRYPTION_KEY: "true"
      RMM_TRUST_PROXY_HEADERS: ${RMM_TRUST_PROXY_HEADERS:-true}
      RMM_ENFORCE_CONSOLE_RELAY_INGRESS: ${RMM_ENFORCE_CONSOLE_RELAY_INGRESS:-true}
      RMM_ALLOW_LEGACY_AGENT_RELAY: ${RMM_ALLOW_LEGACY_AGENT_RELAY:-false}
      RMM_MCP_ALLOWED_IPS: ${RMM_MCP_ALLOWED_IPS:-}
      RMM_MCP_OAUTH_ENABLED: ${RMM_MCP_OAUTH_ENABLED:-false}
      RMM_AI_PROVIDER: ${RMM_AI_PROVIDER:-openai-compatible}
      RMM_AI_BASE_URL: ${RMM_AI_BASE_URL:-https://api.openai.com/v1}
      RMM_AI_API_KEY_FILE: /run/secrets/ai_api_key
      RMM_AI_MODEL: ${RMM_AI_MODEL:-gpt-4o-mini}
      RMM_ALLOW_UNAPPROVED_JOBS: ${RMM_ALLOW_UNAPPROVED_JOBS:-false}
      RMM_REMOTE_PROVIDER: ${RMM_REMOTE_PROVIDER:-native}
      RMM_API_RATE_LIMIT: ${RMM_API_RATE_LIMIT:-600}
      RMM_SMTP_HOST: ${RMM_SMTP_HOST:-}
      RMM_SMTP_PORT: ${RMM_SMTP_PORT:-587}
      RMM_SMTP_USERNAME: ${RMM_SMTP_USERNAME:-}
      RMM_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      RMM_SMTP_FROM: ${RMM_SMTP_FROM:-}
      RMM_SMTP_FROM_NAME: ${RMM_SMTP_FROM_NAME:-OpenRMM}
      RMM_SMTP_TLS_MODE: ${RMM_SMTP_TLS_MODE:-starttls}
      RMM_ALERT_RETENTION_DAYS: ${RMM_ALERT_RETENTION_DAYS:-90}
      RMM_CHECK_RESULT_RETENTION_DAYS: ${RMM_CHECK_RESULT_RETENTION_DAYS:-90}
      RMM_NOTIFICATION_RETENTION_DAYS: ${RMM_NOTIFICATION_RETENTION_DAYS:-90}
    secrets:
      - postgres_password
      - admin_token
      - settings_encryption_key
      - ai_api_key
      - smtp_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    networks:
      - db
      - edge
      - egress
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: ${SERVER_MEMORY_LIMIT:-1g}
    cpus: ${SERVER_CPU_LIMIT:-2.0}
    pids_limit: ${SERVER_PIDS_LIMIT:-256}
    stop_grace_period: 30s
    <<: *security

  frontend:
    image: ${FRONTEND_IMAGE:-openrmm-frontend:local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.4.1-alpine@sha256:820e86612c21d0636580206d802a726f2595366e1b867e564cbc652024151e8a}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
        OPENRMM_BASE_PATH: ${OPENRMM_BASE_PATH:-/}
    user: "101:101"
    depends_on:
      server:
        condition: service_healthy
    environment:
      OPENRMM_BASE_PATH: ${OPENRMM_BASE_PATH:-/}
      NGINX_ENVSUBST_FILTER: ^OPENRMM_BASE_PATH$
    volumes:
      - ./nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./public:/usr/share/nginx/dl:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /var/cache/nginx:rw,nosuid,nodev,uid=101,gid=101,mode=0750
      - /etc/nginx/conf.d:rw,nosuid,nodev,uid=101,gid=101,mode=0750
      - /var/run:rw,nosuid,nodev,uid=101,gid=101,mode=0750
    networks:
      - edge
    ports:
      # With loopback binds, source-IP ACLs belong to the upstream TLS edge.
      # These binds prevent direct edge bypass; they are not an internal UFW rule.
      - "${AGENTS_BIND_ADDRESS:-127.0.0.1}:${AGENTS_PORT:-8443}:8080"
      - "${CONSOLE_BIND_ADDRESS:-127.0.0.1}:${CONSOLE_PORT:-9443}:8081"
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-7443}:8082"
    healthcheck:
      test: ["CMD-SHELL", "base=$${OPENRMM_BASE_PATH:-/}; wget -q --spider \"http://127.0.0.1:8081/$${base#/}index.html\" && wget -q --spider \"http://127.0.0.1:8081/$${base#/}assets/app.js\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.50}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    stop_grace_period: 15s
    <<: *security

volumes:
  rmm_pgdata:
  # Landing zone for archived WAL. deploy/ops/ship-wal.sh copies it offsite and
  # prunes what the newest base backup no longer needs — the archive grows
  # without bound otherwise.
  rmm_pgwal:

networks:
  db:
    internal: true
  edge:
  egress:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  admin_token:
    file: ${RMM_ADMIN_TOKEN_FILE:-./secrets/admin_token}
  settings_encryption_key:
    file: ${RMM_SETTINGS_ENCRYPTION_KEY_FILE:-./secrets/settings_encryption_key}
  ai_api_key:
    # Optional: /dev/null yields an empty key without requiring a placeholder.
    file: ${RMM_AI_API_KEY_FILE:-/dev/null}
  smtp_password:
    # Optional, same convention: an empty password with no relay configured just
    # means password-reset mail is off.
    file: ${RMM_SMTP_PASSWORD_FILE:-/dev/null}
