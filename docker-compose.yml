services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: rmm
      POSTGRES_DB: rmm
    ports:
      - "5432:5432"
    volumes:
      - rmm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RMM_HTTP_ADDR: ":8080"
      RMM_PUBLIC_URL: "http://localhost:8080"
      RMM_DATABASE_URL: "postgres://rmm:rmm@postgres:5432/rmm?sslmode=disable"
      RMM_ADMIN_TOKEN: "${RMM_ADMIN_TOKEN:-change-me-to-a-long-random-string}"
      RMM_AI_BASE_URL: "${RMM_AI_BASE_URL:-https://api.openai.com/v1}"
      RMM_AI_API_KEY: "${RMM_AI_API_KEY:-}"
      RMM_AI_MODEL: "${RMM_AI_MODEL:-gpt-4o-mini}"
      RMM_REMOTE_PROVIDER: "${RMM_REMOTE_PROVIDER:-native}"
      RMM_MESHCENTRAL_URL: "${RMM_MESHCENTRAL_URL:-}"
    ports:
      - "8080:8080"

volumes:
  rmm_pgdata:
