# Explicit host-based auth for OpenRMM's PostgreSQL.
#
# Mounted read-only and selected with `-c hba_file=...`, because the official
# image's generated file only allows replication from localhost — a standby on
# the db network is rejected with "no pg_hba.conf entry for replication
# connection", and `host all all all` does NOT cover replication (it is a
# separate keyword, not a database name).
#
# The db network is `internal: true`, so "all" here means "other containers on
# the private database network", not the internet.

# Unix socket inside the container: healthchecks, backup.sh, restore.sh.
local   all             all                                     trust

# Loopback inside the container.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# The application, over the internal db network.
host    all             all             all                     scram-sha-256

# Physical replication for the warm standby. Restricted to the dedicated
# `replicator` role, which has REPLICATION but no table privileges — a leaked
# standby credential cannot read or write application data directly.
local   replication     all                                     trust
host    replication     replicator      127.0.0.1/32            scram-sha-256
host    replication     replicator      ::1/128                 scram-sha-256
host    replication     replicator      all                     scram-sha-256
